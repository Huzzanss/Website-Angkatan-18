<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan &amp; Kesan | Angkatan 18</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="../../style.css">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("a18_theme") || "dark");</script>
</head>
<body data-root="../../" data-page="messages">
    <div id="siteHeader"></div>

    <main>
        <div class="page-header">
            <div class="page-header-icon" data-icon="message"></div>
            <h1>Pesan &amp; Kesan</h1>
            <p>Tinggalkan kenangan untuk teman seangkatan</p>
        </div>

        <div class="msg-form-wrap">
            <div class="msg-form-card">
                <h3>Tulis Pesan</h3>
                <form id="form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fName">Nama</label>
                            <input id="fName" maxlength="100" placeholder="Boleh dikosongkan (Anonim)">
                        </div>
                        <div class="form-group">
                            <label for="fTo">Untuk</label>
                            <input id="fTo" maxlength="100" placeholder="Nama teman (opsional)">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="fCat">Kategori</label>
                        <select id="fCat">
                            <option>Pesan</option><option>Kesan</option><option>Kenangan</option><option>Harapan</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fContent">Isi</label>
                        <textarea id="fContent" maxlength="1000" placeholder="Tulis pesan kamu di sini..."></textarea>
                        <div class="char-count"><span id="count">0</span>/1000</div>
                    </div>
                    <div class="form-error" id="err" hidden></div>
                    <button class="btn btn-full" id="submitBtn" type="submit">Kirim Pesan</button>
                </form>
            </div>
            <div class="notice" style="width:100%;margin-top:14px"><span data-icon="info" data-size="16"></span><span>Pesan akan tampil setelah disetujui admin.</span></div>
        </div>

        <div class="msg-filter-wrap">
            <div class="category-tabs" id="tabs"></div>
            <span class="form-hint" id="total"></span>
        </div>
        <div class="msg-list" id="list">
            <div class="loading-state"><div class="spinner"></div>Memuat pesan...</div>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script src="../../sound.js"></script>
    <script src="../../common.js"></script>
    <script>
    (function () {
        var A = window.A18;
        var CATS = ["Semua", "Pesan", "Kesan", "Kenangan", "Harapan"];
        var COLORS = { Pesan: "var(--accent)", Kesan: "var(--blue)", Kenangan: "var(--pink)", Harapan: "var(--orange)" };
        var items = [];
        var active = "Semua";
        var list = document.getElementById("list");

        var tabs = document.getElementById("tabs");
        tabs.innerHTML = CATS.map(function (c) {
            return '<button class="cat-tab' + (c === active ? " active" : "") + '" data-cat="' + c + '">' + c + "</button>";
        }).join("");
        tabs.addEventListener("click", function (e) {
            var b = e.target.closest("[data-cat]");
            if (!b) return;
            active = b.getAttribute("data-cat");
            Array.prototype.forEach.call(tabs.children, function (x) { x.classList.toggle("active", x === b); });
            render();
        });

        function render() {
            var shown = items.filter(function (m) { return active === "Semua" || m.category === active; });
            document.getElementById("total").textContent = shown.length + " pesan";
            if (!shown.length) {
                list.innerHTML = '<div class="empty-state">Belum ada pesan di kategori ini.</div>';
                return;
            }
            list.innerHTML = shown.map(function (m) {
                return '<article class="msg-card" style="--cat-color:' + (COLORS[m.category] || "var(--accent)") + '">' +
                    '<div class="msg-card-top"><div class="msg-avatar">' + A.esc(A.initials(m.name)) + "</div>" +
                    '<div class="msg-meta"><strong>' + A.esc(m.name) + "</strong>" +
                    (m.to ? '<span class="msg-to">untuk ' + A.esc(m.to) + "</span>" : "") +
                    '<div class="msg-date">' + A.esc(A.relativeTime(m.createdAt)) + "</div></div>" +
                    '<span class="msg-cat-badge">' + A.esc(m.category) + "</span></div>" +
                    '<p class="msg-content">' + A.esc(m.content) + "</p></article>";
            }).join("");
        }

        function load() {
            A.api("/messages").then(function (data) { items = data; render(); })
                .catch(function (err) { list.innerHTML = '<div class="empty-state">' + A.esc(err.message) + "</div>"; });
        }

        var content = document.getElementById("fContent");
        content.addEventListener("input", function () { document.getElementById("count").textContent = content.value.length; });

        document.getElementById("form").addEventListener("submit", function (e) {
            e.preventDefault();
            var err = document.getElementById("err");
            var btn = document.getElementById("submitBtn");
            err.hidden = true;
            if (!content.value.trim()) {
                err.textContent = "Isi pesan tidak boleh kosong.";
                err.hidden = false;
                return;
            }
            btn.disabled = true;
            A.api("/messages", {
                method: "POST",
                body: {
                    name: document.getElementById("fName").value,
                    to: document.getElementById("fTo").value,
                    category: document.getElementById("fCat").value,
                    content: content.value
                }
            }).then(function (r) {
                A.toast(r.message || "Terkirim.");
                e.target.reset();
                document.getElementById("count").textContent = "0";
                if (typeof playSfx === "function") playSfx("success");
            }).catch(function (ex) {
                err.textContent = ex.message;
                err.hidden = false;
            }).then(function () { btn.disabled = false; });
        });

        load();
    })();
    </script>
</body>
</html>
