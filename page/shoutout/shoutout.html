<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoutout | Angkatan 18</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="../../style.css">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("a18_theme") || "dark");</script>
</head>
<body data-root="../../" data-page="shoutout">
    <div id="siteHeader"></div>

    <main>
        <div class="page-header">
            <div class="page-header-icon" data-icon="shout"></div>
            <h1>Shoutout</h1>
            <p>Beri apresiasi untuk teman-teman</p>
        </div>

        <div class="msg-form-wrap">
            <div class="msg-form-card">
                <h3>Kirim Shoutout</h3>
                <form id="form" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="fTo">Untuk</label>
                            <input id="fTo" maxlength="100" placeholder="Nama teman" required>
                        </div>
                        <div class="form-group">
                            <label for="fFrom">Dari</label>
                            <input id="fFrom" maxlength="100" placeholder="Boleh dikosongkan (Anonim)">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="fType">Jenis</label>
                        <select id="fType">
                            <option>Terima kasih</option><option>Selamat</option><option>Semangat</option><option>Maaf</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fMsg">Pesan</label>
                        <textarea id="fMsg" maxlength="500" placeholder="Tulis shoutout kamu..."></textarea>
                        <div class="char-count"><span id="count">0</span>/500</div>
                    </div>
                    <div class="form-error" id="err" hidden></div>
                    <button class="btn btn-full" id="submitBtn" type="submit">Kirim Shoutout</button>
                </form>
            </div>
            <div class="notice" style="width:100%;margin-top:14px"><span data-icon="info" data-size="16"></span><span>Shoutout akan tampil setelah disetujui admin.</span></div>
        </div>

        <div class="stack" id="list">
            <div class="loading-state"><div class="spinner"></div>Memuat shoutout...</div>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script src="../../sound.js"></script>
    <script src="../../common.js"></script>
    <script>
    (function () {
        var A = window.A18;
        var list = document.getElementById("list");
        var msg = document.getElementById("fMsg");

        function load() {
            A.api("/shoutouts").then(function (items) {
                if (!items.length) {
                    list.innerHTML = '<div class="empty-state">Belum ada shoutout. Jadilah yang pertama!</div>';
                    return;
                }
                list.innerHTML = items.map(function (s) {
                    return '<article class="shout-card"><div class="shout-icon-wrap">' + A.icon("shout", 22) + "</div>" +
                        '<div class="shout-body"><div class="shout-header"><span class="shout-to">' + A.esc(s.to) + "</span>" +
                        '<span class="pill">' + A.esc(s.type) + "</span>" +
                        '<span class="shout-from">dari ' + A.esc(s.from) + " &middot; " + A.esc(A.relativeTime(s.createdAt)) + "</span></div>" +
                        '<p class="msg-content">' + A.esc(s.message) + "</p></div></article>";
                }).join("");
            }).catch(function (err) {
                list.innerHTML = '<div class="empty-state">' + A.esc(err.message) + "</div>";
            });
        }

        msg.addEventListener("input", function () { document.getElementById("count").textContent = msg.value.length; });

        document.getElementById("form").addEventListener("submit", function (e) {
            e.preventDefault();
            var err = document.getElementById("err");
            var btn = document.getElementById("submitBtn");
            var to = document.getElementById("fTo").value.trim();
            err.hidden = true;
            if (!to || !msg.value.trim()) {
                err.textContent = "Nama tujuan dan pesan wajib diisi.";
                err.hidden = false;
                return;
            }
            btn.disabled = true;
            A.api("/shoutouts", {
                method: "POST",
                body: { to: to, from: document.getElementById("fFrom").value, type: document.getElementById("fType").value, message: msg.value }
            }).then(function (r) {
                A.toast(r.message || "Terkirim.");
                e.target.reset();
                document.getElementById("count").textContent = "0";
                if (typeof playSfx === "function") playSfx("success");
            }).catch(function (ex) {
                err.textContent = ex.message;
                err.hidden = false;
            }).then(function () { btn.disabled = false; });
        });

        load();
    })();
    </script>
</body>
</html>
