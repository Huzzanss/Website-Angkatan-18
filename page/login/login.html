<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Login Admin | Angkatan 18</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="../../style.css">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("a18_theme") || "dark");</script>
</head>
<body data-root="../../" data-page="login">
    <div id="siteHeader"></div>

    <main class="auth-wrap">
        <div class="auth-card">
            <div class="auth-icon" data-icon="shield" data-size="24"></div>
            <h1>Login Admin</h1>
            <p>Masukkan password untuk mengelola konten</p>
            <form class="auth-form" id="form" novalidate>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-pw-wrap">
                        <input type="password" id="password" autocomplete="current-password" placeholder="Password admin" required>
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan password"><span data-icon="eye" data-size="18"></span></button>
                    </div>
                </div>
                <div class="form-error" id="err" hidden></div>
                <button class="btn btn-full" id="submitBtn" type="submit">Masuk</button>
            </form>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script src="../../sound.js"></script>
    <script src="../../common.js"></script>
    <script>
    (function () {
        var A = window.A18;
        var pw = document.getElementById("password");
        var err = document.getElementById("err");
        var btn = document.getElementById("submitBtn");

        // Sudah login? langsung ke panel.
        if (A.getToken()) {
            A.api("/auth/check", { auth: true }).then(function () {
                location.replace("../admin/admin.html");
            }).catch(function () { A.clearToken(); });
        }

        document.getElementById("togglePw").addEventListener("click", function () {
            pw.type = pw.type === "password" ? "text" : "password";
        });

        document.getElementById("form").addEventListener("submit", function (e) {
            e.preventDefault();
            err.hidden = true;
            if (!pw.value) { err.textContent = "Password wajib diisi."; err.hidden = false; return; }
            btn.disabled = true;
            btn.textContent = "Memeriksa...";
            A.api("/auth/login", { method: "POST", body: { password: pw.value } }).then(function (r) {
                A.setToken(r.token);
                location.href = "../admin/admin.html";
            }).catch(function (ex) {
                err.textContent = ex.message;
                err.hidden = false;
                pw.value = "";
                pw.focus();
                if (typeof playSfx === "function") playSfx("error");
                btn.disabled = false;
                btn.textContent = "Masuk";
            });
        });

        pw.focus();
    })();
    </script>
</body>
</html>
