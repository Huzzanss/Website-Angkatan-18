<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri | Angkatan 18</title>
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
    <link rel="stylesheet" href="../../style.css">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("a18_theme") || "dark");</script>
</head>
<body data-root="../../" data-page="gallery">
    <div id="siteHeader"></div>

    <main>
        <div class="page-header">
            <div class="page-header-icon" data-icon="image"></div>
            <h1>Galeri</h1>
            <p>Foto dan momen spesial Angkatan 18</p>
        </div>

        <div class="controls" style="justify-content:center">
            <button class="btn" id="sendBtn"><span data-icon="upload" data-size="16"></span> Kirim Foto</button>
        </div>

        <div class="gallery-section">
            <div class="gallery-grid" id="grid">
                <div class="loading-state"><div class="spinner"></div>Memuat galeri...</div>
            </div>
        </div>
    </main>

    <!-- MODAL KIRIM FOTO -->
    <div class="modal-overlay" id="sendModal" hidden>
        <div class="modal-box">
            <div class="modal-head"><h3>Kirim Foto</h3><button class="modal-close" id="sendClose" aria-label="Tutup"><span data-icon="x" data-size="18"></span></button></div>
            <form id="sendForm" novalidate>
                <div class="form-group">
                    <label for="sFile">Foto</label>
                    <div class="file-drop" id="sDrop">Klik untuk memilih foto (JPG, PNG, atau WEBP)</div>
                    <input type="file" id="sFile" accept="image/jpeg,image/png,image/webp" hidden>
                    <img id="sPreview" alt="Pratinjau foto" hidden style="width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:10px">
                </div>
                <div class="form-group"><label for="sCaption">Keterangan (opsional)</label><input id="sCaption" maxlength="120" placeholder="Misalnya: Study tour 2026"></div>
                <div class="form-group"><label for="sName">Nama pengirim (opsional)</label><input id="sName" maxlength="60" placeholder="Boleh dikosongkan"></div>
                <div class="notice" style="width:100%;margin:0 0 16px"><span data-icon="info" data-size="16"></span><span>Foto tayang setelah disetujui admin. Kirim hanya foto yang pantas dan bukan milik orang lain tanpa izin.</span></div>
                <div class="form-error" id="sErr" hidden></div>
                <div class="modal-actions">
                    <button type="button" class="btn-ghost" id="sCancel">Batal</button>
                    <button type="submit" class="btn" id="sBtn">Kirim</button>
                </div>
            </form>
        </div>
    </div>

    <div id="lightbox" role="dialog" aria-modal="true" aria-label="Pratinjau foto">
        <div id="lightboxOverlay"></div>
        <div id="lightboxContent">
            <button id="lightboxClose" aria-label="Tutup"><span data-icon="x" data-size="20"></span></button>
            <img id="lightboxImg" src="" alt="">
            <p id="lightboxTitle"></p>
        </div>
    </div>

    <div id="siteFooter"></div>

    <script src="../../sound.js"></script>
    <script src="../../common.js"></script>
    <script>
    (function () {
        var A = window.A18;
        var photos = [];
        var current = -1;
        var grid = document.getElementById("grid");
        var box = document.getElementById("lightbox");
        var img = document.getElementById("lightboxImg");
        var title = document.getElementById("lightboxTitle");

        function render() {
            if (!photos.length) {
                grid.innerHTML = '<div class="gallery-placeholder">Belum ada foto di galeri.</div>';
                return;
            }
            grid.innerHTML = photos.map(function (p, i) {
                return '<div class="gallery-item" data-i="' + i + '" tabindex="0" role="button" aria-label="Buka foto ' + (i + 1) + '">' +
                    '<img src="' + A.esc(p.url) + '" alt="' + A.esc(p.caption || "Foto angkatan") + '" loading="lazy">' +
                    (p.caption ? '<div class="gallery-item-overlay"><p>' + A.esc(p.caption) + "</p></div>" : "") +
                    "</div>";
            }).join("");
        }

        var lastFocus = null;
        function show(i) {
            if (!photos.length) return;
            if (current < 0) lastFocus = document.activeElement;
            current = (i + photos.length) % photos.length;
            img.src = photos[current].url;
            img.alt = photos[current].caption || "Foto angkatan";
            title.textContent = (photos[current].caption ? photos[current].caption + " - " : "") + (current + 1) + " / " + photos.length;
            box.classList.add("open");
            document.getElementById("lightboxClose").focus();
        }
        function close() {
            box.classList.remove("open");
            img.src = "";
            current = -1;
            if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        grid.addEventListener("click", function (e) {
            var item = e.target.closest(".gallery-item");
            if (item) show(Number(item.getAttribute("data-i")));
        });
        grid.addEventListener("keydown", function (e) {
            var item = e.target.closest(".gallery-item");
            if (item && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(Number(item.getAttribute("data-i"))); }
        });
        document.getElementById("lightboxClose").addEventListener("click", close);
        document.getElementById("lightboxOverlay").addEventListener("click", close);
        window.addEventListener("keydown", function (e) {
            if (current < 0) return;
            if (e.key === "Escape") close();
            if (e.key === "ArrowRight") show(current + 1);
            if (e.key === "ArrowLeft") show(current - 1);
        });

        /* ---- kirim foto (masuk antrean admin) ---- */
        var sendModal = document.getElementById("sendModal");
        var sFile = document.getElementById("sFile");
        var sPreview = document.getElementById("sPreview");
        var sErr = document.getElementById("sErr");
        var sDrop = document.getElementById("sDrop");
        var DROP_TEXT = "Klik untuk memilih foto (JPG, PNG, atau WEBP)";
        var sendFocus = null;

        function openSend() {
            sendFocus = document.activeElement;
            sendModal.hidden = false;
            sDrop.focus();
        }
        function closeSend() {
            if (sendModal.hidden) return;
            sendModal.hidden = true;
            if (sendFocus && sendFocus.focus) sendFocus.focus();
        }
        function resetSend() {
            document.getElementById("sendForm").reset();
            sPreview.hidden = true;
            sPreview.removeAttribute("src");
            sDrop.textContent = DROP_TEXT;
            sErr.hidden = true;
        }

        document.getElementById("sendBtn").addEventListener("click", openSend);
        document.getElementById("sendClose").addEventListener("click", closeSend);
        document.getElementById("sCancel").addEventListener("click", closeSend);
        sendModal.addEventListener("click", function (e) { if (e.target === sendModal) closeSend(); });
        window.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSend(); });

        sDrop.setAttribute("tabindex", "0");
        sDrop.setAttribute("role", "button");
        sDrop.addEventListener("click", function () { sFile.click(); });
        sDrop.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sFile.click(); }
        });
        sFile.addEventListener("change", function () {
            var f = sFile.files[0];
            sErr.hidden = true;
            if (!f) return;
            sPreview.src = URL.createObjectURL(f);
            sPreview.hidden = false;
            sDrop.textContent = f.name;
        });

        document.getElementById("sendForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var f = sFile.files[0];
            var btn = document.getElementById("sBtn");
            sErr.hidden = true;
            if (!f) { sErr.textContent = "Pilih foto dulu."; sErr.hidden = false; return; }
            btn.disabled = true;
            btn.textContent = "Mengirim...";
            A.compressImage(f, 0.9 * 1024 * 1024).then(function (b64) {
                return A.api("/gallery/submit", {
                    method: "POST",
                    body: {
                        contentType: "image/jpeg",
                        dataBase64: b64,
                        caption: document.getElementById("sCaption").value,
                        uploader: document.getElementById("sName").value
                    }
                });
            }).then(function (r) {
                A.toast(r.message || "Foto terkirim.");
                if (typeof playSfx === "function") playSfx("success");
                resetSend();
                closeSend();
            }).catch(function (ex) {
                sErr.textContent = ex.message;
                sErr.hidden = false;
            }).then(function () {
                btn.disabled = false;
                btn.textContent = "Kirim";
            });
        });

        A.api("/gallery").then(function (data) {
            photos = data;
            render();
        }).catch(function (err) {
            grid.innerHTML = '<div class="gallery-placeholder">' + A.esc(err.message) + "</div>";
        });
    })();
    </script>
</body>
</html>
